[tool.poetry]
name = "mtga-draft-tool"
version = "4.27"
description = "Magic: The Gathering Arena draft tool that utilizes 17Lands data."
authors = ["unrealities"]
readme = "README.md"
packages = [
    { include = "src" },
    { include = "server" }
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "2.5.4"
Pillow = "13.0.0"
pydantic = "2.14.1"
requests = "2.34.2"
ttkbootstrap = "2.2.5"
numba = "0.68.1"
scipy = "1.18.1"
pywin32 = {version = "312", markers = "sys_platform == 'win32'"}

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
pytest-cov = "^7.1.0"
responses = "0.26.3"
seleniumbase = "4.56.4"
pyinstaller = "6.22.3"
jaraco-text = "*"
platformdirs = "*"
importlib-metadata = "*"
zipp = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
