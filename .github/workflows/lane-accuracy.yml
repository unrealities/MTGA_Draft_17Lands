name: Lane accuracy

# Measures how well the advisor's lane predicts the colors drafters end up
# playing. See experiments/2026-11-15-lane-accuracy/PROTOCOL.md.
#
# Run by hand: Actions > Lane accuracy > Run workflow.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of set codes, e.g. ["FRA", "TDM"] (empty: the replay''s ten)'
        default: ""
      drafts:
        description: Drafts per set
        default: "3000"
      salt:
        description: Any text; changes which drafts are sampled
        default: ""

permissions:
  contents: read

env:
  DRAFTS: ${{ inputs.drafts || '3000' }}
  SALT: ${{ inputs.salt }}

jobs:
  lanes:
    name: Lanes ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.sets || '["DFT", "FDN", "FIN", "FRA", "HOB", "MSH", "SOS", "TDM", "TLA", "TMT"]') }}
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the dumps and the app's dataset
        run: |
          base=https://data.17landscapes.com/analysis_data
          curl -fsSL --retry 3 -o dump.csv.gz "$base/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o games.csv.gz "$base/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Sample drafts
        run: poetry run python Tools/AdvisorReplay/sample.py --dump dump.csv.gz --drafts "$DRAFTS" --salt "$SALT" --out drafts.json.gz
      - name: Name the lane at every pick
        run: poetry run python Tools/AdvisorReplay/lanes.py --drafts drafts.json.gz --games games.csv.gz --dataset dataset.json.gz --set "$SET" --out "results/$SET.lanes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: lanes-${{ matrix.set }}
          path: results/

  report:
    needs: lanes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: lanes-*
          path: results
          merge-multiple: true
      - name: Report
        shell: bash
        run: |
          {
            echo "# Lane accuracy at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/AdvisorReplay/lanes_report.py results/*.json
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: lanes-report
          path: report.md
