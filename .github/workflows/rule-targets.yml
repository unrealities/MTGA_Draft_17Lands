name: Rule targets

# Tests whether what six of the advisor's pick rules steer by (removal,
# heavy curves, fixing, creatures, 2-drops) changed how often
# registered decks won, on 17Lands Premier Draft game data.
# See experiments/2026-11-03-rule-targets/PROTOCOL.md.
#
# Run by hand: Actions > Rule targets > Run workflow.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of 17Lands set codes, e.g. ["FRA", "TDM"] (empty: every set with game data and ratings)'
        default: ""
      decks:
        description: Decks per set
        default: "50000"
      salt:
        description: Any text; changes which decks are sampled
        default: ""

permissions:
  contents: read

jobs:
  features:
    uses: ./.github/workflows/deck-score-features.yml
    with:
      sets: ${{ inputs.sets }}
      decks: ${{ inputs.decks || '50000' }}
      salt: ${{ inputs.salt }}

  rules:
    needs: features
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: features-*
          path: results
          merge-multiple: true
      - name: Test the rules
        shell: bash  # with pipefail, so a failed fit fails the step
        run: |
          {
            echo "# Rule targets at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/DeckScoreFit/rules.py results/*.json --json rules.json
          } | tee rules.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rule-targets
          path: |
            rules.md
            rules.json
